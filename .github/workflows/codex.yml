name: Codex compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  codex:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SEO_TEST_RETAIN_DIR: test-runs/${{ github.run_id }}-${{ github.run_attempt }}/retained
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pytest PyYAML
      - run: python scripts/build_codex.py
      - run: python -m pytest -p tests.preserve_artifacts tests/test_codex_port.py tests/test_content_humanize.py tests/test_gsc_totals_aggregate.py tests/test_gsc_pagination.py tests/test_url_safety.py --basetemp=test-runs/${{ github.run_id }}-${{ github.run_attempt }}/tmp -o cache_dir=test-runs/${{ github.run_id }}-${{ github.run_attempt }}/cache --junitxml=test-runs/${{ github.run_id }}-${{ github.run_attempt }}/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-runs/
